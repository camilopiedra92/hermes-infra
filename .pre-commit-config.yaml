# Hooks are pinned by commit SHA (`pre-commit autoupdate --freeze`). Dependabot does not
# cover pre-commit; refresh with `pre-commit autoupdate --freeze` in a PR.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]
default_language_version:
  python: python3
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^third_party/gvisor/.*\.patch$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: ^third_party/gvisor/.*\.patch$ # context lines of a diff end in a space

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/ansible/ansible-lint
    rev: b74fb6f73d234bf92672372cb1c10768e4018d16 # frozen: v26.11.0
    hooks:
      - id: ansible-lint
        files: ^infra/ansible/
        args: [--project-dir, infra/ansible]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

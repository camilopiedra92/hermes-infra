[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
stdout_callback = default
result_format = yaml
interpreter_python = /usr/bin/python3
retry_files_enabled = False
# Facts stay under ansible_facts. Injected ansible_* fact variables are
# deprecated and this playbook does not use them.
inject_facts_as_vars = False

[ssh_connection]
pipelining = True

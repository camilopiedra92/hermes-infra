---
# The Hermes host. Reached over the tailnet only.
# Connection options for a session without system Tailscale are in
# docs/runbooks/operator-access.md.
all:
  children:
    hermes:
      hosts:
        hermes-prod:
          ansible_host: hermes  # MagicDNS name of the tailnet node; the address is not published
          # The operations user is hermesops.
          ansible_user: hermesops

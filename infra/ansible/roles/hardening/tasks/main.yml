---
- name: Install the kernel and network hardening
  ansible.builtin.copy:
    src: 60-hermes-hardening.conf
    dest: /etc/sysctl.d/60-hermes-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Load the sysctl hardening

- name: Keep unused network protocols from loading
  ansible.builtin.copy:
    src: hermes-blacklist-protocols.conf
    dest: /etc/modprobe.d/hermes-blacklist-protocols.conf
    owner: root
    group: root
    mode: "0644"

- name: Restrict SSH (validated before it is installed)
  ansible.builtin.copy:
    src: 60-hermes-hardening-sshd.conf
    dest: /etc/ssh/sshd_config.d/60-hermes-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH

- name: Install the reboot window units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - hermes-reboot-window.service
    - hermes-reboot-window.timer
  notify: Reload systemd

- name: Enable the reboot window timer
  ansible.builtin.systemd_service:
    name: hermes-reboot-window.timer
    enabled: true
    state: started

- name: Create the drop-in directories of the sandboxed services
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ hardening_sandboxed_services }}"

- name: Sandbox the Hermes root services
  ansible.builtin.template:
    src: service-sandbox.conf.j2
    dest: "/etc/systemd/system/{{ item }}.service.d/50-sandbox.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ hardening_sandboxed_services }}"
  notify: Reload systemd

- name: Remove the services of the cloud image that this server does not use
  ansible.builtin.apt:
    name: "{{ hardening_purged_packages }}"
    state: absent
    purge: true
    autoremove: true

# The runtime of rootless containers depends on neither the timer nor the restart service: the images are pinned and
# loaded by the role, and a container is started by the agent that needs it.
- name: Stop the automatic update and restart of containers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    masked: true
    state: stopped
  loop:
    - podman-auto-update.timer
    - podman-auto-update.service
    - podman-restart.service

---
# The account, the key path and the address live in bin/hermes/pins.json (admin), because the
# nftables rule, and the egress test must agree with them. tasks/main.yml loads that file.

bot_admin_sudo_logfile: /var/log/sudo-hermesops.log
bot_admin_sudoers_path: /etc/sudoers.d/92-hermesadmin
bot_admin_sshd_dropin: /etc/ssh/sshd_config.d/10-hermesadmin.conf

# `hermes-admin-channel off` moves the key here. While this file exists the role keeps the channel closed.
bot_admin_off_file: /var/lib/hermes/admin-authorized_keys.off

---
- name: "Load the egress rule of {{ hermes_tier_name }}"
  ansible.builtin.command: /usr/sbin/nft -f /etc/nftables.d/30-hermes-{{ hermes_tier_name }}.nft
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: "Restart the proxy of {{ hermes_tier_name }}"
  ansible.builtin.systemd_service:
    name: tinyproxy-{{ hermes_tier_name }}.service
    state: restarted
  when: not ansible_check_mode

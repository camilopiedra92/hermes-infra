---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Keep ufw disabled (one firewall manager)
  ansible.builtin.systemd_service:
    name: ufw
    enabled: false
    state: stopped

- name: Keep ufw configuration disabled
  ansible.builtin.lineinfile:
    path: /etc/ufw/ufw.conf
    regexp: '^ENABLED='
    line: ENABLED=no

- name: Create the nftables include directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Hermes filter table
  ansible.builtin.template:
    src: hermes_filter.nft.j2
    dest: /etc/nftables.d/10-hermes-filter.nft
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Install the nftables entry point
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Enable nftables at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

---
# The loopback backend for Hermes Desktop. The login is a random password; only its scrypt hash reaches the service.
- name: Create the directory of the Desktop login
  ansible.builtin.file:
    path: "{{ hermes_gateway_serve_dir }}"
    state: directory
    owner: root
    group: "{{ hermes_pins.state.owner }}"
    mode: "0750"

- name: Install the credential generator
  ansible.builtin.copy:
    src: hermes-dashboard-credentials
    dest: /usr/local/sbin/hermes-dashboard-credentials
    owner: root
    group: root
    mode: "0750"

- name: Create the Desktop login once (random password, only its hash goes to the service)
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/hermes-dashboard-credentials
      - "{{ hermes_gateway_serve_dir }}"
      - "{{ hermes_pins.state.owner }}"
      - "{{ hermes_gateway_serve_user }}"
    creates: "{{ hermes_gateway_serve_dir }}/serve.env"
  no_log: true

- name: Read the tailnet name of this host (never stored in git)
  ansible.builtin.command: tailscale status --self --json
  register: hermes_gateway_tailscale_self
  changed_when: false
  check_mode: false

- name: Install the backend unit
  ansible.builtin.template:
    src: hermes-serve.service.j2
    dest: /etc/systemd/user/hermes-serve.service
    owner: root
    group: root
    mode: "0644"
  vars:
    hermes_gateway_serve_url: >-
      https://{{ (hermes_gateway_tailscale_self.stdout | from_json).Self.DNSName.rstrip('.') }}
  notify:
    - Reload user units
    - Restart the backend

- name: Apply the unit before it is enabled
  ansible.builtin.meta: flush_handlers

- name: Publish the backend inside the tailnet over HTTPS (Tailscale Serve, no public exposure)
  ansible.builtin.command: tailscale serve --bg --yes --https=443 http://127.0.0.1:{{ hermes_gateway_serve_port }}
  changed_when: false

- name: Enable the backend at boot and keep it running
  ansible.builtin.systemd_service:
    name: hermes-serve.service
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ hermes_pins.state.owner }}"
  vars:
    ansible_remote_tmp: "/tmp/.ansible-{{ hermes_pins.state.owner }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hermes_gateway_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ hermes_gateway_uid }}/bus"

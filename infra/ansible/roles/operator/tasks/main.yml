---
- name: Load the Hermes pins
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../bin/hermes/pins.json"
    name: hermes_pins
  tags: [always]

- name: Read the account of the admin bot
  ansible.builtin.getent:
    database: passwd
    key: "{{ operator_user }}"
  failed_when: false
  changed_when: false
  check_mode: false

- name: Require the account and its home
  ansible.builtin.assert:
    that:
      - ansible_facts['getent_passwd'][operator_user] is defined
      - ansible_facts['getent_passwd'][operator_user][4] == operator_home
    fail_msg: "User {{ operator_user }} must exist with home {{ operator_home }} before it is given root."
  when: not ansible_check_mode or (ansible_facts['getent_passwd'][operator_user] is defined)

- name: Check whether root was closed by hand
  ansible.builtin.stat:
    path: "{{ operator_off_file }}"
  register: operator_off
  changed_when: false
  check_mode: false

# Validated before it is installed: a broken sudoers file would take sudo away from everyone.
- name: Give the admin bot root through sudo, logged as text
  ansible.builtin.template:
    src: 92-hermes-operator.j2
    dest: "{{ operator_sudoers_path }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: not operator_off.stat.exists

- name: Keep root closed while it was closed by hand
  ansible.builtin.file:
    path: "{{ operator_sudoers_path }}"
    state: absent
  when: operator_off.stat.exists

# The owner delivers the GitHub token here with `sudo hermes-secret-put GITHUB_TOKEN` (0600, this account). The role creates
# the directory and never writes the token.
- name: Create the directory of the delivered GitHub token
  ansible.builtin.file:
    path: "{{ operator_home }}/.config/hermes"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0700"

- name: Install the switch of the root access
  ansible.builtin.copy:
    src: hermes-admin-access
    dest: /usr/local/sbin/hermes-admin-access
    owner: root
    group: root
    mode: "0750"

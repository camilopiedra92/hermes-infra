---
# The worker has its own proxy so that the names it needs (web search) never widen the admin account's allowlist.
- name: Install the worker proxy configuration
  ansible.builtin.template:
    src: tinyproxy-worker.conf.j2
    dest: /etc/tinyproxy/tinyproxy-worker.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart the worker proxy

- name: Install the list of names the worker may reach
  ansible.builtin.template:
    src: tinyproxy-worker-allow.filter.j2
    dest: /etc/tinyproxy/hermes-worker-allow.filter
    owner: root
    group: root
    mode: "0644"
  notify: Restart the worker proxy

- name: Install the worker proxy unit
  ansible.builtin.template:
    src: tinyproxy-worker.service.j2
    dest: /etc/systemd/system/tinyproxy-worker.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart the worker proxy

- name: Apply the unit and the proxy before the worker gateway can start
  ansible.builtin.meta: flush_handlers

- name: Enable the worker proxy
  ansible.builtin.systemd_service:
    name: tinyproxy-worker.service
    enabled: true
    state: started
  when: not ansible_check_mode

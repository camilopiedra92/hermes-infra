---
- name: Load the worker egress rule
  ansible.builtin.command: /usr/sbin/nft -f /etc/nftables.d/30-hermes-worker.nft
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart the worker proxy
  ansible.builtin.systemd_service:
    name: tinyproxy-worker.service
    state: restarted
  when: not ansible_check_mode

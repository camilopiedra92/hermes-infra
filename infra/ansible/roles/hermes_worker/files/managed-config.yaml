# Hermes managed scope for the tier-1 worker (docs/ARCHITECTURE.md). Owned by root in /etc/hermes-worker.
# The worker reads untrusted content and holds no credential: its tools run in a rootless container, never on the host.

security:
  allow_lazy_installs: false

telemetry:
  shared_metrics:
    enabled: false
    send: false

# Search and page reading go through one pinned free keyless vendor that fetches the pages itself, so the worker never
# connects to an arbitrary host and a URL pointing at a private range cannot be reached from here.
web:
  backend: keenable
  provider_tier:
    keenable: free
  keyless_fallback: false
  keyless_rescue: false

gateway:
  systemd_watchdog_seconds: 120

# Terminal, files, skills and planning act inside the container. No cron, no delegation, no code-execution on the host.
platform_toolsets:
  telegram:
    - web
    - clarify
    - memory
    - session_search
    - todo
    - terminal
    - file
    - skills

agent:
  disabled_toolsets:
    - code_execution
    - browser
    - delegation
    - computer_use
    - image_gen
    - video_gen
    - tts
    - kanban
    - connections
    - catalog
    - cronjob

# Every command runs in a rootless container with the stock crun runtime (docs/ARCHITECTURE.md, Sandbox). Hermes already
# drops all capabilities but five, sets no-new-privileges, mounts tmpfs and applies cpu, memory and pids limits.
# Extra run flags would only duplicate or collide with those.
terminal:
  backend: docker
  docker_image: docker.io/library/python:3.14-slim
  docker_network: false
  container_cpu: 1
  container_memory: 1024
  container_persistent: true
  # Files the worker produces for the owner (MEDIA delivery): the only host path the container sees.
  docker_volumes:
    - /home/hermesworker/.hermes/cache/documents:/output

approvals:
  mode: manual
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny

model:
  provider: claude-subscription-directsdk-experimental
  default: claude-sonnet-5-5

auth:
  adopt_external_logins: false

updates:
  check: false

plugins:
  auto_apply: false
  entries:
    claude-subscription-directsdk-experimental:
      settings:
        claude_config_dir: /home/hermesworker/.claude
        claude_code_telemetry: false

providers:
  claude-subscription-directsdk-experimental:
    stale_timeout_seconds: 900

skills:
  guard_agent_created: true
  write_approval: false
